name: AI Issue Runner (Ephemeral Compute)

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    # Trigger when labeled with 'ai-run' or on comment '@ai-runner /fix'
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-run')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@ai-runner'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Runner
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/${{ github.repository }}.git || pip install -e .

      - name: Import Credentials
        run: |
          ai-runner auth import "${{ secrets.AI_RUNNER_AUTH }}"

      - name: Execute Guarded Agentic Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ai-runner run \
            --issue "${{ github.event.issue.html_url }}" \
            --workspace "." \
            --harness "native"

      - name: Create Pull Request with Verified Fix
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(ai-runner): automated resolution for issue #${{ github.event.issue.number }}"
          title: "🤖 AI Fix for Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            Autonomous resolution generated by **AI Issue Runner**.
            
            - **Issue**: #${{ github.event.issue.number }}
            - **Guarded Loop Status**: ✅ All Acceptance Criteria verified and passing
          branch: "ai-runner/issue-${{ github.event.issue.number }}"
          delete-branch: true
